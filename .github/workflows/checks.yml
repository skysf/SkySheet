# 两台 macOS 同时跑 Mac 自检和移动端 UI。check-all 是 main 保护规则要求的汇总项。
name: checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.suite }}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core
            host: macos-26
            cache: .build
            family: iPad
            runtime: "26.5"
          - suite: ui
            host: macos-15
            cache: .build/ui-checks
            family: iPhone
            runtime: "18.6"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode for iOS 18.6
        if: matrix.host == 'macos-15'
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer' >> "$GITHUB_ENV"

      - name: Toolchain versions
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM build products
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache }}
          key: swiftpm-${{ matrix.suite }}-${{ matrix.host }}-${{ hashFiles('Package.swift') }}
          restore-keys: swiftpm-${{ matrix.suite }}-${{ matrix.host }}-

      - name: Run Mac checks
        run: scripts/check-all.sh "${{ matrix.suite }}"

      - name: Build SkyFolio and verify Files, autosave and version history
        env:
          SKYFOLIO_SIM_FAMILY: ${{ matrix.family }}
          SKYFOLIO_SIM_RUNTIME: ${{ matrix.runtime }}
          SKYFOLIO_RESULTS: ${{ runner.temp }}/SkyFolio-Mobile
        run: scripts/check-ios.sh

      - name: Upload simulator app and test screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: SkyFolio-Mobile-${{ matrix.family }}
          path: ${{ runner.temp }}/SkyFolio-Mobile
          if-no-files-found: ignore

  check-all:
    name: check-all
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both Mac and mobile configurations to succeed
        env:
          RESULT: ${{ needs.verify.result }}
        run: |
          echo "Mac and mobile checks finished with $RESULT"
          test "$RESULT" = success
